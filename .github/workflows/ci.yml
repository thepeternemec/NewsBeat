name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # No secrets and no database: the tests are pure, and the build does not
      # connect to anything. A contributor can run this whole job locally.
      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Agent and PostgreSQL integration tests
        run: npm run test:integration
