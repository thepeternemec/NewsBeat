name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # No secrets and no database: the tests are pure, and the build does not
      # connect to anything. A contributor can run this whole job locally.
      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  intelligence-database:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: newsbeat_intelligence_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5499:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d newsbeat_intelligence_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NEWSBEAT_INTELLIGENCE_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5499/newsbeat_intelligence_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build pipeline packages
        run: npm run build:packages && npm run build -w @newsbeat/api && npm run build -w newsbeat-worker
      - name: Verify event memory against disposable Postgres
        run: node --test --test-concurrency=1 apps/api/dist/lib/intelligence-store.test.js apps/api/dist/lib/market-intelligence-store.test.js apps/api/dist/lib/catalyst-store.test.js apps/api/dist/lib/investment.test.js apps/worker/dist/ingest-news-store.test.js apps/worker/dist/priority-collection-store.test.js

  intelligence-live-read:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build-test, intelligence-database]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify deployed read path and scheduled analysis
        run: node .github/scripts/intelligence-live.mjs

  mcp-live-read:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build-test]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify deployed MCP initialization, tools and research
        run: node .github/scripts/mcp-live.mjs
